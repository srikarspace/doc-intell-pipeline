[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence pipeline: CUAD contract PDFs -> cited, validated JSON."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["learn"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, UP = modern syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
